<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cricket Clash</title>
    <style>
      :root {
        --bg: #071a2a;
        --panel: #122b42;
        --panel-2: #183a52;
        --accent: #ffd166;
        --accent-2: #06d6a0;
        --danger: #ff5d73;
        --text: #edf6ff;
        --muted: #a7c3dc;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #183a52 0%, var(--bg) 45%, #020b14 100%);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .game {
        width: min(960px, 92vw);
        background: rgba(18, 43, 66, 0.94);
        border: 2px solid rgba(255,255,255,0.08);
        border-radius: 22px;
        box-shadow: 0 24px 70px rgba(0,0,0,0.45);
        padding: 22px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .player-input-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        padding: 8px 12px;
      }

      .player-input-wrap label {
        font-size: 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .player-input-wrap input {
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(0,0,0,0.15);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 10px;
        width: 120px;
        font-size: 14px;
      }

      .match-banner {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        margin: 16px 0 18px;
        padding: 16px 18px;
        background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
      }

      .team-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .team-tag {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--muted);
      }

      .team-name-large {
        font-size: clamp(22px, 3vw, 32px);
        font-weight: 800;
        margin-top: 6px;
      }

      .versus {
        font-size: 18px;
        font-weight: 900;
        color: var(--accent);
        letter-spacing: 2px;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 44px);
        letter-spacing: 1px;
      }

      .badge {
        background: linear-gradient(135deg, var(--accent), #ffb703);
        color: #132638;
        font-weight: 700;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
      }

      .scoreboard {
        display: grid;
        grid-template-columns: repeat(2, minmax(180px, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }

      .panel {
        background: linear-gradient(180deg, var(--panel), var(--panel-2));
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        padding: 18px 16px;
      }

      .team-name {
        font-size: 12px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .score {
        font-size: clamp(30px, 4vw, 44px);
        font-weight: 800;
        line-height: 1;
      }

      .small {
        font-size: 14px;
        color: var(--muted);
        margin-top: 8px;
      }

      .meta-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .meta-card {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px;
        padding: 12px 14px;
        text-align: center;
      }

      .meta-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--muted);
      }

      .meta-value {
        margin-top: 8px;
        font-size: clamp(20px, 3vw, 28px);
        font-weight: 800;
        color: var(--text);
      }

      .status-box {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 14px 16px;
        margin-bottom: 18px;
        min-height: 64px;
      }

      .status-text {
        font-size: 18px;
        font-weight: 700;
        margin: 0;
      }

      .subtext {
        color: var(--muted);
        font-size: 14px;
        margin-top: 8px;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(140px, 1fr));
        gap: 12px;
      }

      button {
        border: none;
        border-radius: 14px;
        padding: 14px 10px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 18px rgba(0,0,0,0.2);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .primary {
        background: linear-gradient(135deg, var(--accent-2), #1ae0a5);
        color: #042b1d;
      }

      .secondary {
        background: linear-gradient(135deg, #f4f7fb, #dfe9f5);
        color: #132638;
      }

      .danger {
        background: linear-gradient(135deg, #ff7a7a, var(--danger));
        color: white;
      }

      .result-box {
        margin-top: 20px;
        padding: 16px;
        border-radius: 14px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        font-size: 18px;
        font-weight: 700;
        min-height: 58px;
      }

      .player-scene {
        position: relative;
        margin: 20px 0 16px;
        height: 180px;
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(4, 30, 48, 0.9), rgba(9, 48, 68, 0.8));
        border: 1px solid rgba(255,255,255,0.08);
        overflow: hidden;
      }

      .pitch {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 52px;
        background: linear-gradient(180deg, #4e7f4b, #2a5d32);
        border-top: 4px solid rgba(255,255,255,0.1);
      }

      .player-figure {
        position: absolute;
        left: 46px;
        bottom: 48px;
        width: 118px;
        height: 118px;
      }

      .head {
        position: absolute;
        left: 46px;
        top: 0;
        width: 26px;
        height: 26px;
        background: #ffd2a6;
        border-radius: 50%;
        border: 2px solid rgba(0,0,0,0.18);
      }

      .body {
        position: absolute;
        left: 32px;
        top: 28px;
        width: 54px;
        height: 52px;
        background: #e63946;
        border-radius: 12px 12px 10px 10px;
      }

      .arm {
        position: absolute;
        left: 75px;
        top: 34px;
        width: 44px;
        height: 10px;
        background: #ffd2a6;
        border-radius: 10px;
        transform-origin: left center;
        animation: batSwing 0.7s ease-in-out infinite alternate;
      }

      .bat {
        position: absolute;
        left: 105px;
        top: 22px;
        width: 52px;
        height: 9px;
        background: linear-gradient(90deg, #d79f4d, #f4d6a7);
        border-radius: 8px;
        box-shadow: 0 0 8px rgba(0,0,0,0.2);
        transform-origin: left center;
        animation: batSwing 0.7s ease-in-out infinite alternate;
      }

      .ball {
        position: absolute;
        left: 160px;
        bottom: 90px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff, #dce7ff 36%, #8ea3d8 100%);
        box-shadow: 0 0 10px rgba(255,255,255,0.5);
        opacity: 0;
      }

      .shot-label {
        position: absolute;
        right: 36px;
        top: 22px;
        font-size: clamp(26px, 4vw, 42px);
        font-weight: 900;
        letter-spacing: 1px;
        color: var(--accent);
        opacity: 0;
        transform: translateY(12px) scale(0.8);
      }

      .player-scene.show-six .shot-label,
      .player-scene.show-four .shot-label,
      .player-scene.show-wicket .shot-label {
        animation: popText 1.1s ease forwards;
      }

      .player-scene.show-six .ball {
        animation: sixShot 1.1s ease forwards;
      }

      .player-scene.show-four .ball {
        animation: fourShot 1s ease forwards;
      }

      .player-scene.show-wicket .ball {
        animation: wicketBall 0.8s ease forwards;
      }

      .last-ball {
        margin-top: 12px;
        font-size: 15px;
        color: var(--muted);
      }

      @keyframes batSwing {
        0% { transform: rotate(-12deg); }
        100% { transform: rotate(30deg); }
      }

      @keyframes sixShot {
        0% { opacity: 1; transform: translate(0, 0) scale(1); }
        20% { opacity: 1; transform: translate(18px, -18px) scale(1.1); }
        100% { opacity: 0; transform: translate(280px, -110px) scale(0.2); }
      }

      @keyframes fourShot {
        0% { opacity: 1; transform: translate(0, 0) scale(1); }
        35% { opacity: 1; transform: translate(120px, -42px) scale(1.05); }
        100% { opacity: 0; transform: translate(220px, -64px) scale(0.3); }
      }

      @keyframes wicketBall {
        0% { opacity: 1; transform: translate(0, 0) scale(1); }
        50% { opacity: 1; transform: translate(110px, 20px) scale(1); }
        100% { opacity: 0; transform: translate(150px, 40px) scale(0.2); }
      }

      @keyframes popText {
        0% { opacity: 0; transform: translateY(10px) scale(0.8); }
        18% { opacity: 1; transform: translateY(0) scale(1.05); }
        100% { opacity: 0; transform: translateY(-12px) scale(1); }
      }

      @media (max-width: 640px) {
        .controls {
          grid-template-columns: 1fr 1fr;
        }
        .scoreboard {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="game">
      <div class="header">
        <h1>Cricket Clash</h1>
        <div class="player-input-wrap">
          <label for="playerNameInput">Your Name</label>
          <input id="playerNameInput" type="text" maxlength="12" value="Player" aria-label="Player name" />
        </div>
        <div class="badge">Quick Match</div>
      </div>

      <div class="match-banner">
        <div class="team-block">
          <span class="team-tag">Player</span>
          <div id="playerTeamName" class="team-name-large">Player</div>
        </div>
        <div class="versus">VS</div>
        <div class="team-block">
          <span class="team-tag">Opponent</span>
          <div class="team-name-large">CPU XI</div>
        </div>
      </div>

      <div class="meta-strip">
        <div class="meta-card">
          <div class="meta-label">Run Rate</div>
          <div id="runRateValue" class="meta-value">0.00</div>
        </div>
        <div class="meta-card">
          <div class="meta-label">Target</div>
          <div id="targetValue" class="meta-value">—</div>
        </div>
        <div class="meta-card">
          <div class="meta-label">Stage</div>
          <div id="stageValue" class="meta-value">Toss</div>
        </div>
      </div>

      <div class="scoreboard">
        <div class="panel">
          <div id="playerNameLabel" class="team-name">Player</div>
          <div id="userScore" class="score">0/0</div>
          <div id="userOvers" class="small">Overs: 0.0</div>
        </div>
        <div class="panel">
          <div class="team-name">CPU XI</div>
          <div id="cpuScore" class="score">0/0</div>
          <div id="cpuOvers" class="small">Overs: 0.0</div>
        </div>
      </div>

      <div id="playerScene" class="player-scene">
        <div class="pitch"></div>
        <div class="player-figure">
          <div class="head"></div>
          <div class="body"></div>
          <div class="arm"></div>
          <div class="bat"></div>
        </div>
        <div id="shotBall" class="ball"></div>
        <div id="shotLabel" class="shot-label">SIX</div>
      </div>

      <div class="status-box">
        <p id="statusText" class="status-text">Tap toss to begin the match.</p>
        <div id="statusSubtext" class="subtext">Choose heads or tails and set the game tone.</div>
      </div>

      <div id="controls" class="controls">
        <button class="primary" id="headsBtn">Heads</button>
        <button class="primary" id="tailsBtn">Tails</button>
        <button class="secondary" id="resetBtn">Reset</button>
      </div>

      <div id="resultBox" class="result-box">Match not started yet.</div>
      <div id="lastBall" class="last-ball">Last ball: —</div>
    </div>

    <script>
      const BALL_LIMIT = 6;
      const userScoreEl = document.getElementById('userScore');
      const cpuScoreEl = document.getElementById('cpuScore');
      const userOversEl = document.getElementById('userOvers');
      const cpuOversEl = document.getElementById('cpuOvers');
      const statusTextEl = document.getElementById('statusText');
      const statusSubtextEl = document.getElementById('statusSubtext');
      const resultBoxEl = document.getElementById('resultBox');
      const lastBallEl = document.getElementById('lastBall');
      const controlsEl = document.getElementById('controls');
      const playerNameInput = document.getElementById('playerNameInput');
      const playerNameLabel = document.getElementById('playerNameLabel');
      const playerTeamName = document.getElementById('playerTeamName');
      const runRateValue = document.getElementById('runRateValue');
      const targetValue = document.getElementById('targetValue');
      const stageValue = document.getElementById('stageValue');
      const playerScene = document.getElementById('playerScene');
      const shotLabel = document.getElementById('shotLabel');

      const state = {
        playerName: 'Player',
        tossDone: false,
        userWonToss: false,
        userChoice: null,
        inning: 1,
        userBatting: false,
        cpuBatting: false,
        userRuns: 0,
        userWickets: 0,
        userBalls: 0,
        cpuRuns: 0,
        cpuWickets: 0,
        cpuBalls: 0,
        target: null,
        matchOver: false,
        lastBall: '—',
        tossCall: null,
        roleMessage: ''
      };

      const battingMoves = [
        { label: 'Defend', wicketChance: 0.12, runs: { 0: 0.52, 1: 0.22, 2: 0.14, 3: 0.06, 4: 0.04, 6: 0.02 } },
        { label: 'Push', wicketChance: 0.12, runs: { 0: 0.34, 1: 0.28, 2: 0.18, 3: 0.1, 4: 0.08, 6: 0.02 } },
        { label: 'Attack', wicketChance: 0.2, runs: { 0: 0.18, 1: 0.18, 2: 0.15, 3: 0.12, 4: 0.2, 6: 0.17 } },
        { label: 'Loft', wicketChance: 0.26, runs: { 0: 0.12, 1: 0.1, 2: 0.12, 3: 0.08, 4: 0.2, 6: 0.38 } }
      ];

      const bowlingMoves = [
        { label: 'Swing', wicketChance: 0.16, runs: { 0: 0.48, 1: 0.18, 2: 0.16, 3: 0.08, 4: 0.06, 6: 0.04 } },
        { label: 'Yorker', wicketChance: 0.18, runs: { 0: 0.36, 1: 0.2, 2: 0.18, 3: 0.12, 4: 0.1, 6: 0.04 } },
        { label: 'Bouncer', wicketChance: 0.14, runs: { 0: 0.28, 1: 0.22, 2: 0.18, 3: 0.12, 4: 0.14, 6: 0.06 } },
        { label: 'Spin', wicketChance: 0.15, runs: { 0: 0.32, 1: 0.2, 2: 0.2, 3: 0.1, 4: 0.12, 6: 0.06 } }
      ];

      function getRandomOutcome(probMap) {
        const roll = Math.random();
        let cumulative = 0;
        const entries = Object.entries(probMap).map(([key, value]) => ({ key: Number(key), value }));

        for (const entry of entries) {
          cumulative += entry.value;
          if (roll < cumulative) return entry.key;
        }

        return 0;
      }

      function formatOvers(balls) {
        const overs = Math.floor(balls / 6);
        const remaining = balls % 6;
        return `${overs}.${remaining}`;
      }

      function updateScores() {
        const safeName = state.playerName.trim() || 'Player';
        playerNameLabel.textContent = safeName;
        playerTeamName.textContent = safeName;
        userScoreEl.textContent = `${state.userRuns}/${state.userWickets}`;
        cpuScoreEl.textContent = `${state.cpuRuns}/${state.cpuWickets}`;
        userOversEl.textContent = `Overs: ${formatOvers(state.userBalls)}`;
        cpuOversEl.textContent = `Overs: ${formatOvers(state.cpuBalls)}`;

        let currentRuns = 0;
        let currentBalls = 0;
        if (state.userBatting) {
          currentRuns = state.userRuns;
          currentBalls = state.userBalls;
        } else if (state.cpuBatting) {
          currentRuns = state.cpuRuns;
          currentBalls = state.cpuBalls;
        }

        const totalBalls = currentBalls > 0 ? currentBalls : 0;
        const runRate = totalBalls > 0 ? (currentRuns / totalBalls) * 6 : 0;
        runRateValue.textContent = runRate.toFixed(2);
        targetValue.textContent = state.target !== null ? String(state.target) : '—';

        if (state.matchOver) {
          stageValue.textContent = 'Finished';
        } else if (!state.tossDone) {
          stageValue.textContent = 'Toss';
        } else if (state.target !== null) {
          stageValue.textContent = state.userBatting ? 'Chase' : 'Defend';
        } else if (state.userBatting) {
          stageValue.textContent = 'Batting';
        } else if (state.cpuBatting) {
          stageValue.textContent = 'Bowling';
        } else {
          stageValue.textContent = 'Tossed';
        }
      }

      function setStatus(text, subtext) {
        statusTextEl.textContent = text;
        statusSubtextEl.textContent = subtext;
      }

      function setLastBall(label) {
        state.lastBall = label;
        lastBallEl.textContent = `Last ball: ${label}`;
      }

      function showShotFeedback(runs, type = 'normal') {
        playerScene.classList.remove('show-six', 'show-four', 'show-wicket');
        void playerScene.offsetWidth;

        if (runs >= 6) {
          shotLabel.textContent = 'SIX';
          playerScene.classList.add('show-six');
        } else if (runs >= 4) {
          shotLabel.textContent = 'FOUR';
          playerScene.classList.add('show-four');
        } else if (type === 'wicket') {
          shotLabel.textContent = 'W';
          playerScene.classList.add('show-wicket');
        } else {
          shotLabel.textContent = runs === 0 ? '0' : String(runs);
          playerScene.classList.add('show-four');
        }
      }

      function addActionButtons(buttons) {
        controlsEl.innerHTML = '';
        buttons.forEach((buttonConfig) => {
          const btn = document.createElement('button');
          btn.className = buttonConfig.className || 'secondary';
          btn.textContent = buttonConfig.label;
          btn.addEventListener('click', buttonConfig.action);
          controlsEl.appendChild(btn);
        });
      }

      playerNameInput.addEventListener('input', (event) => {
        const value = event.target.value.trim();
        state.playerName = value || 'Player';
        playerNameLabel.textContent = state.playerName;
        playerTeamName.textContent = state.playerName;
      });

      function resetGame() {
        state.tossDone = false;
        state.userWonToss = false;
        state.userChoice = null;
        state.inning = 1;
        state.userBatting = false;
        state.cpuBatting = false;
        state.userRuns = 0;
        state.userWickets = 0;
        state.userBalls = 0;
        state.cpuRuns = 0;
        state.cpuWickets = 0;
        state.cpuBalls = 0;
        state.target = null;
        state.matchOver = false;
        state.lastBall = '—';
        state.tossCall = null;
        state.roleMessage = '';
        updateScores();
        setLastBall('—');
        resultBoxEl.textContent = 'Match not started yet.';
        setStatus('Tap toss to begin the match.', 'Choose heads or tails and set the game tone.');
        initTossButtons();
      }

      function initTossButtons() {
        addActionButtons([
          { label: 'Heads', className: 'primary', action: () => callToss('Heads') },
          { label: 'Tails', className: 'primary', action: () => callToss('Tails') },
          { label: 'Reset', className: 'secondary', action: resetGame }
        ]);
      }

      function callToss(call) {
        if (state.tossDone || state.matchOver) return;

        const tossResult = Math.random() < 0.5 ? 'Heads' : 'Tails';
        state.tossCall = call;
        state.tossDone = true;

        if (call === tossResult) {
          state.userWonToss = true;
          setStatus('You won the toss!', 'Now choose whether to bat or bowl first.');
          resultBoxEl.textContent = `Toss: ${tossResult} — you won it!`;
          addActionButtons([
            { label: 'Bat First', className: 'primary', action: () => chooseBattingRole(true) },
            { label: 'Bowl First', className: 'primary', action: () => chooseBattingRole(false) },
            { label: 'Reset', className: 'secondary', action: resetGame }
          ]);
        } else {
          const cpuChoice = Math.random() < 0.5;
          state.userWonToss = false;
          const roleText = cpuChoice ? 'bat first' : 'bowl first';
          setStatus('CPU won the toss.', `CPU chose to ${roleText}.`);
          resultBoxEl.textContent = `Toss: ${tossResult} — CPU won and chose to ${roleText}.`;
          setTimeout(() => {
            if (cpuChoice) {
              chooseBattingRole(false);
            } else {
              chooseBattingRole(true);
            }
          }, 700);
        }
      }

      function chooseBattingRole(userWillBat) {
        state.userChoice = userWillBat ? 'bat' : 'bowl';
        state.userBatting = userWillBat;
        state.cpuBatting = !userWillBat;
        updateScores();

        if (userWillBat) {
          setStatus('You chose to bat first.', 'Play your shots carefully and build a strong total.');
          startUserBatting();
        } else {
          setStatus('CPU will bat first.', 'You have to bowl and stop them from running away.');
          startUserBowling();
        }
      }

      function startUserBatting() {
        state.inning = 1;
        addActionButtons([
          { label: 'Defend', className: 'secondary', action: () => resolveUserBatting('Defend') },
          { label: 'Push', className: 'secondary', action: () => resolveUserBatting('Push') },
          { label: 'Attack', className: 'secondary', action: () => resolveUserBatting('Attack') },
          { label: 'Loft', className: 'danger', action: () => resolveUserBatting('Loft') }
        ]);
      }

      function startUserBowling() {
        state.inning = 1;
        addActionButtons([
          { label: 'Swing', className: 'secondary', action: () => resolveUserBowling('Swing') },
          { label: 'Yorker', className: 'secondary', action: () => resolveUserBowling('Yorker') },
          { label: 'Bouncer', className: 'secondary', action: () => resolveUserBowling('Bouncer') },
          { label: 'Spin', className: 'danger', action: () => resolveUserBowling('Spin') }
        ]);
      }

      function finishFirstInnings(team) {
        if (team === 'user') {
          state.target = state.userRuns + 1;
          state.userBatting = false;
          state.cpuBatting = true;
          setStatus('Innings over!', `You scored ${state.userRuns}. CPU needs ${state.target} to win.`);
          resultBoxEl.textContent = `Your innings ends at ${state.userRuns}/${state.userWickets}. CPU needs ${state.target} runs.`;
          updateScores();
          startUserBowling();
        } else {
          state.target = state.cpuRuns + 1;
          state.userBatting = true;
          state.cpuBatting = false;
          setStatus('CPU innings ends!', `CPU scored ${state.cpuRuns}. You need ${state.target} to win.`);
          resultBoxEl.textContent = `CPU finishes on ${state.cpuRuns}/${state.cpuWickets}. You need ${state.target} to chase.`;
          updateScores();
          startUserBatting();
        }
      }

      function finishMatch() {
        state.matchOver = true;
        const userTotal = state.userRuns;
        const cpuTotal = state.cpuRuns;

        if (userTotal > cpuTotal) {
          setStatus('You won the match!', 'A strong finish under pressure.');
          resultBoxEl.textContent = `Victory! You won by ${userTotal - cpuTotal} runs.`;
        } else if (cpuTotal > userTotal) {
          setStatus('CPU won the match.', 'The chase was too strong tonight.');
          resultBoxEl.textContent = `Defeat! CPU won by ${cpuTotal - userTotal} runs.`;
        } else {
          setStatus('Match tied!', 'Both teams finish level.');
          resultBoxEl.textContent = 'It is a tie!';
        }

        updateScores();
        addActionButtons([
          { label: 'Play Again', className: 'primary', action: resetGame },
          { label: 'Reset', className: 'secondary', action: resetGame }
        ]);
      }

      function resolveUserBattingInChase(moveLabel) {
        if (state.matchOver || !state.userBatting) return;
        const move = battingMoves.find((m) => m.label === moveLabel);
        let result;
        const randomValue = Math.random();

        if (randomValue < move.wicketChance) {
          result = 'W';
          state.userWickets += 1;
        } else {
          result = getRandomOutcome(move.runs);
        }

        const value = result === 'W' ? 0 : Number(result);
        state.userRuns += value;
        state.userBalls += 1;
        setLastBall(`${moveLabel} → ${result === 'W' ? 'W' : result}`);
        if (result === 'W') {
          showShotFeedback(0, 'wicket');
        } else {
          showShotFeedback(Number(result));
        }
        updateScores();

        if (state.userRuns >= state.target) {
          finishMatch();
          return;
        }

        if (state.userBalls >= BALL_LIMIT || state.userWickets >= 10) {
          finishMatch();
          return;
        }

        setStatus('Chase on!', `Need ${state.target - state.userRuns} off ${BALL_LIMIT - state.userBalls} balls.`);
      }

      function resolveUserBowlingInChase(moveLabel) {
        if (state.matchOver || !state.cpuBatting) return;
        const move = bowlingMoves.find((m) => m.label === moveLabel);
        let result;
        const randomValue = Math.random();

        if (randomValue < move.wicketChance) {
          result = 'W';
          state.cpuWickets += 1;
        } else {
          result = getRandomOutcome(move.runs);
        }

        const value = result === 'W' ? 0 : Number(result);
        state.cpuRuns += value;
        state.cpuBalls += 1;
        setLastBall(`${moveLabel} → ${result === 'W' ? 'W' : result}`);
        updateScores();

        if (state.cpuRuns >= state.target) {
          finishMatch();
          return;
        }

        if (state.cpuBalls >= BALL_LIMIT || state.cpuWickets >= 10) {
          finishMatch();
          return;
        }

        setStatus('Defending a total!', `CPU needs ${state.target - state.cpuRuns} off ${BALL_LIMIT - state.cpuBalls} balls.`);
      }

      function resolveUserBatting(moveLabel) {
        if (state.matchOver) return;

        if (state.target !== null) {
          resolveUserBattingInChase(moveLabel);
          return;
        }

        const move = battingMoves.find((m) => m.label === moveLabel);
        const random = Math.random();
        let result;

        if (random < move.wicketChance) {
          result = 'W';
          state.userWickets += 1;
        } else {
          result = getRandomOutcome(move.runs);
        }

        const runValue = result === 'W' ? 0 : Number(result);
        state.userRuns += runValue;
        state.userBalls += 1;
        setLastBall(`${moveLabel} → ${result === 'W' ? 'W' : result}`);
        if (result === 'W') {
          showShotFeedback(0, 'wicket');
        } else {
          showShotFeedback(Number(result));
        }
        updateScores();

        if (state.userBalls >= BALL_LIMIT || state.userWickets >= 10) {
          finishFirstInnings('user');
          return;
        }

        setStatus('You are batting.', `Score: ${state.userRuns}/${state.userWickets} | Balls: ${formatOvers(state.userBalls)}`);
      }

      function resolveUserBowling(moveLabel) {
        if (state.matchOver) return;

        if (state.target !== null) {
          resolveUserBowlingInChase(moveLabel);
          return;
        }

        const move = bowlingMoves.find((m) => m.label === moveLabel);
        const random = Math.random();
        let result;

        if (random < move.wicketChance) {
          result = 'W';
          state.cpuWickets += 1;
        } else {
          result = getRandomOutcome(move.runs);
        }

        const runValue = result === 'W' ? 0 : Number(result);
        state.cpuRuns += runValue;
        state.cpuBalls += 1;
        setLastBall(`${moveLabel} → ${result === 'W' ? 'W' : result}`);
        updateScores();

        if (state.cpuBalls >= BALL_LIMIT || state.cpuWickets >= 10) {
          finishFirstInnings('cpu');
          return;
        }

        setStatus('You are bowling.', `CPU: ${state.cpuRuns}/${state.cpuWickets} | Balls: ${formatOvers(state.cpuBalls)}`);
      }

      state.playerName = (playerNameInput.value || 'Player').trim() || 'Player';
      playerNameInput.value = state.playerName;
      playerNameLabel.textContent = state.playerName;
      playerTeamName.textContent = state.playerName;
      resetGame();
    </script>
  </body>
</html>
